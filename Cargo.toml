[package]
name = "lab-api"
version = "0.5.1"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }