<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>School Database</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --text:#c9d1d9; --dim:#8b949e; --bd:#30363d; --link:#58a6ff; }
    body { font-family: system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:1.25rem; max-width:1100px; margin-inline:auto; }
    h1 { font-size:1.35rem; margin:0 0 .25rem; }
    .sub { color:var(--dim); margin-bottom:1.25rem; }
    .classes { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
    .classes button { background:var(--card); border:1px solid var(--bd); color:var(--text); padding:.4rem .7rem; border-radius:6px; cursor:pointer; }
    .classes button.active { border-color:var(--link); color:#fff; }
    input[type=search] { width:100%; max-width:320px; padding:.5rem .7rem; border-radius:6px; border:1px solid var(--bd); background:#0d1117; color:var(--text); margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { border-bottom:1px solid var(--bd); padding:.45rem .4rem; text-align:left; vertical-align:top; }
    th { color:var(--dim); font-weight:600; }
    .pager { display:flex; gap:.5rem; margin-top:1rem; align-items:center; }
    .err { color:#f85149; }
    .lock { color:var(--dim); font-size:.85rem; }
  </style>
</head>
<body>
  <h1>School Database</h1>
  <p class="sub">Read-only student portal <span class="lock">🔒 auth required</span></p>
  <div id="classes" class="classes"></div>
  <input type="search" id="q" placeholder="Search students..." disabled>
  <div id="meta" class="sub"></div>
  <div id="out"></div>
  <div class="pager">
    <button type="button" id="prev" disabled>Prev</button>
    <button type="button" id="next" disabled>Next</button>
  </div>
  <script src="/school/school.js"></script>
</body>
</html>
